name: CI / Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: ${{ startsWith(github.ref, 'refs/tags/') }}
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            builder_args: --mac --arm64

          - platform: macos-latest
            target: x86_64-apple-darwin
            builder_args: --mac --x64

          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            builder_args: --win --x64

          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            builder_args: --linux deb --x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Type-check
        run: pnpm typecheck

      - name: Build application
        run: pnpm build

      - name: Package application
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PUBLISH=never
          RELEASE_TYPE=release
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            PUBLISH=always
            if [[ "${GITHUB_REF_NAME}" =~ -(alpha|beta|rc) ]]; then RELEASE_TYPE=prerelease; fi
          fi
          pnpm exec electron-builder ${{ matrix.builder_args }} \
            --publish "$PUBLISH" \
            -c.publish.releaseType="$RELEASE_TYPE"

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: bloxbot-${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.deb
            release/*.blockmap
            release/latest*.yml
