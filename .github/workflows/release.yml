name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Releases must run from main, not ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Read and validate version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.ts validate

  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bloxbot-*
          path: release
          merge-multiple: true

      - name: Verify and atomically publish the release
        run: node scripts/release.ts publish release
